
services:
  api:
    build: .
    container_name: task-manager-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  tests:
    build: .
    command: pytest -v
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
    profiles:
      - testing
